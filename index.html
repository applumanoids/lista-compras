<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Minha Lista de Compras – Lumanoids</title>
<meta name="description" content="Monte a lista em casa e acompanhe o total no supermercado. Lumanoids.">
<meta name="theme-color" content="#e83e8c">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Compras">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<header class="topo">
  <div class="topo-info"><button id="btnInfo" class="btn-info" aria-label="Informações">ⓘ Informações</button></div>
  <div class="total">
    <div>
      <span class="total-rotulo">Total da compra</span>
      <strong id="total">R$ 0,00</strong>
    </div>

  </div>
  <div class="contadores">
    <div class="chip azul"><b id="cPend">0</b><span>pendentes</span></div>
    <div class="chip verde"><b id="cCarr">0</b><span>no carrinho</span></div>
    <div class="chip amarelo"><b id="cSem">0</b><span>sem preço</span></div>
  </div>
</header>

<main>
  <div class="ferramentas">
    <button class="btn-sec" id="btnCalc">🧮 Calculadora</button>
    <button class="btn-sec" id="btnCopiar">📋 Copiar lista</button>
  </div>

  <!-- CARRINHO -->
  <section class="area area-carrinho" aria-labelledby="tCarrinho">
    <div class="area-topo">
      <h2 id="tCarrinho">🛒 Adicionados ao Carrinho</h2>
      <span class="area-qtd" id="qtdCarrinho">0</span>
    </div>
    <div id="listaCarrinho" class="itens"></div>
  </section>

  <!-- LISTA -->
  <section class="area area-lista" aria-labelledby="tLista">
    <div class="area-topo">
      <h2 id="tLista">📝 Lista de Compras</h2>
      <span class="area-qtd" id="qtdLista">0</span>
    </div>

    <div class="form-add">
      <div class="campo-busca">
        <input id="inpNome" type="text" placeholder="Digite o produto (ex.: Arr…)" autocomplete="off" autocapitalize="sentences" enterkeyhint="done">
        <div id="sugestoes" class="sugestoes" hidden></div>
      </div>
      <button id="btnAdd" class="btn-prim">Adicionar</button>
    </div>
    <button id="btnCatalogo" class="btn-link">📚 Escolher do catálogo</button>

    <div id="listaPendentes" class="itens"></div>
  </section>

  <div class="rodape-acoes">
    <button class="btn-perigo" id="btnLimpar">🗑️ Limpar lista</button>
  </div>
  <p class="aviso">Seus dados ficam salvos só neste aparelho. Limpar os dados do navegador ou desinstalar o app apaga a lista.</p>
  <div id="instalacaoRodape" class="instalacao-rodape" hidden><button id="btnInstalar" class="btn-sec" type="button">📲 Instalar aplicativo no celular</button><p id="instrucaoInstalar" hidden></p></div>
  <footer class="creditos">Criado por <strong>Lumanoids</strong></footer>
</main>

<div id="fundo" class="fundo" hidden></div>
<div id="sheet" class="sheet" role="dialog" aria-modal="true" hidden></div>
<div id="toast" class="toast" role="status" aria-live="polite"></div>

<script src="js/catalogo.js"></script>
<script src="js/app.js"></script>
</body>
</html>
